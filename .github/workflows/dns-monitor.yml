name: DNS Monitor

on:
  schedule:
    - cron: '0 * * * *' # hourly at minute 0 UTC
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'scripts/check-dns.sh'
      - '.github/workflows/dns-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dns-monitor
  cancel-in-progress: true

jobs:
  check-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x ./scripts/check-dns.sh

      - name: Run DNS check
        id: check
        continue-on-error: true
        run: ./scripts/check-dns.sh

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-report
          path: scripts/dns-report.txt
          if-no-files-found: warn

      - name: Find existing DNS incident issue
        id: existing
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search 'in:title "DNS Monitor: autosparkbd.com"' \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create issue on failure
        if: steps.check.outcome == 'failure' && steps.existing.outputs.number == ''
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: 'DNS Monitor: autosparkbd.com is not serving from Vercel'
          content-file: scripts/dns-report.txt

      - name: Fail the job when DNS is unhealthy
        if: steps.check.outcome == 'failure'
        run: exit 1

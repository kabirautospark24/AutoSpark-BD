    <!-- Prevent FOUC: apply theme class before first paint -->
    <script>
      (function(){
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Custom domain: no ?/-redirect hack. GitHub serves dist/404.html (a copy
         of this shell, generated post-build) for deep URLs, so the app boots
         at the real path. The snippet below only heals LEGACY mangled links
         (/?/product/123) left over from the old hack: one history.replaceState,
         no reload — it cannot loop. -->
    <script>
      (function () {
        try {
          var s = window.location.search;
          if (s && s.slice(0, 2) === '?/') {
            var parts = s.slice(2).split('&');
            var path = (parts[0] || '').replace(/~and~/g, '&');
            var rest = parts.slice(1).join('&').replace(/~and~/g, '&');
            var clean = '/' + path + (rest ? '?' + rest : '') + window.location.hash;
            window.history.replaceState(null, '', clean);
          }
        } catch (e) {}
      })();
    </script>

  position: 'left',

    </script>
    <script async
      src="https://g2gijzposiffv7d4aqywxamx.agents.do-ai.run/static/chatbot/widget.js"
      data-agent-id="0c5b5549-2973-11f1-b074-4e013e2ddde4"
      data-chatbot-id="GNLhRayHvMi7GpfUJE-Yc1T_JiFE4ttI"

    </script>
    <script>
      // Robust fallback: if the hosted widget doesn't respect the `position` config,
      // observe DOM mutations and relocate the widget container to the right side.
      // Fully guarded: third-party positioning must never break the app shell.
      (function(){
        try {
        const STARTING_TEXT = 'Hello! How can I help you today?'
        const applyRight = (el) => {
            try{
              // rename behavior: position to left instead of right
              el.style.position = 'fixed'
              el.style.left = '20px'
              el.style.right = 'auto'
              el.style.bottom = el.style.bottom || '24px'
              el.style.zIndex = '2147483647'
              // Ensure pointer events and transform preserve usability
              el.style.pointerEvents = 'auto'
            }catch(e){}
          }

        // Try to find existing candidates immediately (cheap: only dialogs +
        // fixed-position elements, never a full innerText scan of every div)
        const findAndApply = () => {
          try {
            if (!document.body || !document.body.querySelectorAll) return false
            const candidates = document.body.querySelectorAll('[role="dialog"], [data-chatbot], [id*="chatbot"], [class*="chatbot"]')
            for (const el of candidates) {
              const txt = (el.textContent || '')
              if (txt.includes(STARTING_TEXT)) {
                applyRight(el)
                return true
              }
            }
          } catch (e) {}
          return false
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          findAndApply()
        }

        // Observe body for added nodes (the widget may append asynchronously)
        const mo = new MutationObserver((mutations)=>{
          try {
          for (const m of mutations) {
            for (const n of m.addedNodes) {
              if (!(n instanceof HTMLElement)) continue
              const containsStart = (n.textContent || '').includes(STARTING_TEXT)
              if (containsStart) {
                applyRight(n)
                mo.disconnect()
                return
              }
              // check children quickly (bounded: first 50)
              let kids = []
              try { kids = Array.prototype.slice.call(n.querySelectorAll ? n.querySelectorAll('*') : [], 0, 50) } catch (e) {}
              if (kids.some(ch => ((ch.textContent || '').includes(STARTING_TEXT)))) {
                applyRight(n)
                mo.disconnect()
                return
              }
            }
          }
          } catch (e) {}
        })
        try{ if (document.body) mo.observe(document.body, { childList: true, subtree: true }) }catch(e){}
        // As a final attempt, run a short interval to catch slow widgets
        const iv = setInterval(()=>{ if(findAndApply()) { clearInterval(iv); try{ mo.disconnect() }catch(e){} } }, 1000)
        // stop polling after 15s
        setTimeout(()=>{ clearInterval(iv); try{ mo.disconnect() }catch(e){} }, 15000)
        } catch (e) {}
      })()
    </script>

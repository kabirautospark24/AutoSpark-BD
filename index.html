    <!-- Default SEO block. The build-time prerenderer (scripts/prerender.mjs) replaces
         everything between the markers with the tags of the route being rendered. -->

    <title>Auto Spark BD - Exclusive Cars in Rajshahi | Premium Car Dealership Company</title>
    <meta name="description" content="North Bengal's leading premium car showroom in Rajshahi. Browse exclusive luxury vehicles, expert service center, and genuine accessories. Your trusted car dealer since 2014." />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.autosparkbd.com/" />
    <meta property="og:title" content="Auto Spark BD - Exclusive Cars in Rajshahi" />
    <meta property="og:description" content="North Bengal's leading premium car showroom. Exclusive luxury vehicles and expert service." />
    <meta property="og:image" content="https://www.autosparkbd.com/og/og-default.png" />
    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Auto Spark BD - Exclusive Cars in Rajshahi" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.autosparkbd.com/" />
    <meta property="og:site_name" content="Auto Spark BD" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auto Spark BD - Exclusive Cars in Rajshahi" />
    <meta name="twitter:description" content="North Bengal's leading premium car showroom" />
    <meta name="twitter:image" content="https://www.autosparkbd.com/og/og-default.png" />
    <meta name="twitter:image:alt" content="Auto Spark BD - Exclusive Cars in Rajshahi" />
    <!-- Structured Data (JSON-LD). Lives inside the default SEO block so the
         prerenderer can swap it for the per-route schema graph. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoDealer",
      "name": "Auto Spark BD",
      "description": "North Bengal's leading premium car showroom in Rajshahi",
      "url": "https://www.autosparkbd.com",
      "image": "https://www.autosparkbd.com/og/og-default.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Rajshahi",
        "addressCountry": "BD"
      },
      "telephone": "+8801760401605",
      "openingHours": "Sa-Th 09:00-18:00",
      "priceRange": "৳৳৳"
    }
    </script>
    <!--seo-default-end-->
    <!--seo-route-->
    <meta name="theme-color" content="#0E0E0E" />
    
    <!-- Performance: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- 3D model prefetch moved to JS: only for mid/high-tier devices after page load -->
    
    <!-- Performance: Preload critical fonts with font-display swap (Geist display + Outfit body + Hind Siliguri Bengali) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" /></noscript>
    
    <!-- Preload LCP-critical assets -->
    <link rel="preload" href="/logo/logoAS3.svg" as="image" type="image/svg+xml" />
  <!-- preview-image.webp only used in meta tags, not rendered on page -->
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical CSS - prevents layout shift */
      *,*::before,*::after{box-sizing:border-box}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Outfit,Inter,system-ui,-apple-system,sans-serif}
      h1,h2,h3,h4,h5,h6{font-family:Geist,Outfit,system-ui,sans-serif}
      body{margin:0;color:#fff}
      /* Theme-aware background: defaults to dark, light mode overrides */
      body{background:#0f0f0f}
      html:not(.dark) body{background:#f9fafb;color:#111827}
      #root{min-height:100vh;min-height:100dvh}
      /* Hero section placeholder to prevent CLS */
      .hero-placeholder{position:relative;width:100%;height:100vh;height:100dvh;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
      /* Skeleton loading animation */
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      .skeleton{background:linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      /* content-visibility:auto only for below-fold images (avoids LCP issues on hero) */
      img[loading="lazy"]{content-visibility:auto}
    </style>

    <!-- Prevent FOUC: apply theme class before first paint -->
    <script>
      (function(){
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Custom domain: no ?/-redirect hack. The prerendered routes and the SPA
         shell serve every deep URL directly, so the app boots at the real
         path. The snippet below only heals LEGACY mangled links
         (/?/product/123) left over from the old hack: one history.replaceState,
         no reload, it cannot loop. -->
    <script>
      (function () {
        try {
          var s = window.location.search;
          if (s && s.slice(0, 2) === '?/') {
            var parts = s.slice(2).split('&');
            var path = (parts[0] || '').replace(/~and~/g, '&');
            var rest = parts.slice(1).join('&').replace(/~and~/g, '&');
            var clean = '/' + path + (rest ? '?' + rest : '') + window.location.hash;
            window.history.replaceState(null, '', clean);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
